[package]
name = "chunk-trainer"
version = "2.1.0"
description = "دفتر الشانكس — مدرب الشانكس الألمانية + المكتبة المصورة (619 لوحة)"
authors = ["Abdo", "Hossam Mahmoud"]
edition = "2021"

[lib]
name = "chunk_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
